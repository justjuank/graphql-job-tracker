name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: job_tracker_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_tracker_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_tracker_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Test API
        run: npm test
      - name: Validate client
        run: |
          npm --prefix client run lint
          npm --prefix client test
          npm --prefix client run build
