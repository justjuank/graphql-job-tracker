services:
  - type: web
    name: justjuank-graphql-job-tracker-api
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CLIENT_ORIGIN
        value: https://justjuank-graphql-job-tracker.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TURNSTILE_EXPECTED_HOSTNAME
        value: justjuank-graphql-job-tracker.onrender.com
      - key: TURNSTILE_SECRET_KEY
        sync: false

  - type: web
    name: justjuank-graphql-job-tracker
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: npm ci --prefix client && npm --prefix client run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_GRAPHQL_URL
        value: https://justjuank-graphql-job-tracker-api.onrender.com/graphql
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
