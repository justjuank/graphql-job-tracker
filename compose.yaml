services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_tracker"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - job-tracker-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  job-tracker-postgres:
